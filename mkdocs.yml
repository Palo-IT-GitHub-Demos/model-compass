site_name: Model Compass
site_description: >-
  Technical recommendation pipeline for OpenRouter models — quality, security, cost and performance.
repo_url: https://github.com/Palo-IT-GitHub-Demos/model-compass
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_if_no_docstring: false

nav:
  - Home: index.md
  - Workflow: workflow.md
  - "Reading the report": report-reading-guide.md
  - "Presentation (slides)": presentation-model-compass.md
  - "Model Compass scope": model-compass-scope.md
  - Methodology:
      - "Quality": quality-methodology.md
      - "Security": security-methodology.md
      - "Multi-probe system": multiprobe-system.md
      - "Quality validation — v1 review": quality-validation/review-v1.md
      - "gen-e2-eval comparison template": quality-validation/gen-e2-eval-comparison-template.md
  - API reference: reference/api.md
  - "ADR (French)":
      - "0001 — Initial architecture": adr/0001-architecture-initiale.md
      - "0002 — Benchmark-informed methodology": adr/0002-benchmark-informed-evaluation-methodology.md
  - Maintaining the documentation: documentation.md
  - "Project history (French)":
      - "Delivery plan v0.4 → v0.5": plans/plan-livraison-v0.4.md
      - "Brief manager (2026-08-17)": brief-manager-2026-08-17.md
      - "Brief manager (2026-09-08)": brief-manager-2026-09-08.md
      - "Audit critique (2026-08-21)": audit-2026-08-21.md
      - "Roadmap d'amélioration (2026)": plans/project-improvement-roadmap-2026.md
      - "V2 — Pipeline async, observabilité, juge hybride": plans/feature-pipeline-v2-1.md
      - "Sécurité & coût — spécialisation": plans/feature-security-cost-specialization-1.md
      - "Model Compass — recherche benchmarks et développement": implementation-plans/01-model-compass-benchmark-research-and-development.md
      - "Model Compass — amélioration du pipeline et de la qualité": implementation-plans/02-pipeline-evaluation-quality-improvement.md
  - "Benchmark research (French)":
      - "Registre des sources": research/benchmark-source-registry.md
      - "Comparaison des benchmarks": research/benchmark-comparison.md
      - "Principes de conception": research/model-compass-design-principles.md
      - "Cartographie benchmark → cas d'usage": research/benchmark-to-use-case-mapping.md
      - "HELM": research/benchmarks/helm.md
      - "MMLU / MMLU-Pro": research/benchmarks/mmlu-family.md
